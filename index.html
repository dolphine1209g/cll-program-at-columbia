<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wang lab@Columbia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main id="home">
      <!-- Hero Gallery -->
      <section class="hero" aria-label="Hero gallery">
        <div class="hero-gallery" data-gallery>
          <div class="slides" data-slides>
            <!-- Replace these image files with your own -->
            <div class="slide is-active">
              <img src="images/hero1.jpg" alt="Lab hero image 1" />
            </div>
            <div class="slide">
              <img src="images/hero2.jpg" alt="Lab hero image 2" />
            </div>
            <div class="slide">
              <img src="images/hero3.jpg" alt="Lab hero image 3" />
            </div>
          </div>

          <!-- Overlay text (you can edit later) -->
          <div class="hero-overlay">
            <div class="container">
              <h1 class="hero-title">CLL Program @ Columbia</h1>
            </div>
          </div>

          <!-- Controls -->
          <button class="hero-arrow prev" aria-label="Previous slide" data-prev>‹</button>
          <button class="hero-arrow next" aria-label="Next slide" data-next>›</button>

          <div class="hero-dots" role="tablist" aria-label="Slide dots" data-dots></div>
        </div>
      </section>

      <!-- Team -->
      <section class="section">
        <div class="container">
          <h2 class="page-title">Team</h2>
        </div>
      </section>

      <!-- People list -->
      <section class="section section-muted">
        <div class="container">
          <div class="people">
            <!-- Member 1 -->
            <article class="person">
              <img class="person-photo" src="images/people/1.jpg" alt="Member photo" />
              <div class="person-body">
                <h3 class="person-name">Nicole Lamanna, M.D.&nbsp;<span class="person-role"></span></h3>
                <div class="person-meta">
                    <p>CLL Program Director</p>
                    <p>Professor of Medicine</p>
                    <p><a href="https://doctors.columbia.edu/us/ny/new-york/nicole-lamanna-md-161-fort-washington-avenue">Faculty Webpage</a></p>
                </div>
              </div>
            </article>

            <!-- Member 2 -->
            <article class="person">
              <img class="person-photo" src="images/people/2.jpg" alt="Member photo" />
              <div class="person-body">
                <h3 class="person-name">Andrew Lipsky, M.D.&nbsp;<span class="person-role"></span></h3>
                <div class="person-meta">
                    <p>Assistant Professor of Medicine</p>
                    <p><a href="https://www.cancer.columbia.edu/profile/andrew-h-lipsky-md">Faculty Webpage</a></p>
                </div>
              </div>
            </article>

            <!-- Member 3 -->
            <article class="person">
              <img class="person-photo" src="images/people/3.jpg" alt="Member photo" />
              <div class="person-body">
                <h3 class="person-name">Sunil Iyer, M.D.&nbsp;<span class="person-role"></span></h3>
                <div class="person-meta">
                    <p><a href="https://doctors.columbia.edu/us/ny/new-york/sunil-iyer-md-161-fort-washington-avenue">Faculty Webpage</a></p>
                </div>
              </div>
            </article>

            <!-- Member 4 -->
            <article class="person">
              <img class="person-photo" src="images/people/4.jpg" alt="Member photo" />
              <div class="person-body">
                <h3 class="person-name">Monica Kasbekar, M.D., Ph.D.&nbsp;<span class="person-role"></span></h3>
                <div class="person-meta">
                    <p><a href="https://doctors.columbia.edu/us/ny/new-york/monica-kasbekar-md-phd-161-fort-washington-
avenue">Faculty Webpage</a></p>
                </div>
              </div>
            </article>

            <!-- Add more members by copying the <article class="person"> block -->
          </div>
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container footer-inner">
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
